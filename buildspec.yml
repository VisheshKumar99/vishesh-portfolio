version: 0.2

# ---------------------------------------------------------------------------
# AWS CodeBuild spec for the static Next.js portfolio.
# Pipeline: GitHub -> CodePipeline -> CodeBuild (this file) -> S3 -> CloudFront.
#
# Environment variables to configure in the CodeBuild project (or CodePipeline):
#   S3_BUCKET                 (required) target bucket name, e.g. vishesh-portfolio-site
#   CLOUDFRONT_DISTRIBUTION_ID (optional) to invalidate the CDN cache post-deploy
#   NEXT_PUBLIC_SITE_URL      (recommended) canonical URL for SEO/sitemap
#   NEXT_PUBLIC_GITHUB_USERNAME (optional)
# ---------------------------------------------------------------------------

env:
  variables:
    NODE_VERSION: "20"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Type-checking and linting..."
      - npm run typecheck
      - npm run lint

  build:
    commands:
      - echo "Building static export..."
      - npm run build
      # next.config.mjs uses `output: export`, producing static files in ./out

  post_build:
    commands:
      - echo "Deploying to S3 bucket $S3_BUCKET ..."
      # Long-cache hashed static assets.
      - aws s3 sync ./out "s3://$S3_BUCKET" --delete --cache-control "public,max-age=31536000,immutable" --exclude "*.html" --exclude "*.xml" --exclude "*.txt"
      # HTML / sitemap / robots should not be cached aggressively.
      - aws s3 sync ./out "s3://$S3_BUCKET" --delete --cache-control "public,max-age=0,must-revalidate" --exclude "*" --include "*.html" --include "*.xml" --include "*.txt"
      - |
        if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
          echo "Invalidating CloudFront distribution $CLOUDFRONT_DISTRIBUTION_ID ...";
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*";
        else
          echo "CLOUDFRONT_DISTRIBUTION_ID not set — skipping cache invalidation.";
        fi

artifacts:
  # Also expose the build output as a pipeline artifact for optional downstream stages.
  base-directory: out
  files:
    - "**/*"

cache:
  paths:
    - "node_modules/**/*"
    - ".next/cache/**/*"
